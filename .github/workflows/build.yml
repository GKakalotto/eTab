name: Build Plugin

on:
  push:
    branches:
      - master        # 推送到 master 自动构建
    tags:
      - 'v*'          # 推送 v* 标签时构建并发布 Release（如 git tag v1.2.5）
  pull_request:
    branches:
      - master        # 提 PR 到 master 也构建（仅验证，不发布）
  workflow_dispatch:  # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 从 manifest.json 读取版本号，拼进文件名
      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Plugin version: ${VERSION}"

      # 打包成 zip，排除 git 相关与自身
      - name: Package plugin
        run: |
          zip -r "eTab-${{ steps.version.outputs.version }}.zip" . \
            -x '.git/*' '.github/*' '.gitignore' '*.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eTab-${{ steps.version.outputs.version }}
          path: "eTab-${{ steps.version.outputs.version }}.zip"

      # 推送到 master 时自动发布到 Releases（同名版本会覆盖更新）
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="eTab-${VERSION}.zip"
          TAG="v${VERSION}"
          # 已存在同版本 Release 则先删再重建，确保始终是最后一次构建的包
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --delete-tag
          fi
          gh release create "$TAG" "$ZIP" \
            --title "eTab ${VERSION}" \
            --notes "自动构建于 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
